name: Daily Chicago Crimes Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily_pipeline.yml"
      - "dashboard/**"
      - "src/build_dashboard.py"
  schedule:
    # 01:30 UTC = 07:00 IST
    - cron: "30 1 * * *"

concurrency:
  group: chicago-crimes-production
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run incremental pipeline
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          MOTHERDUCK_DATABASE: chicago_crimes_2020_to_2026
          CHICAGO_APP_TOKEN: ${{ secrets.CHICAGO_APP_TOKEN }}
          PIPELINE_START_YEAR: "2020"
          OVERLAP_HOURS: "24"
        run: python src/pipeline.py

      - name: Assemble verified dashboard
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          MOTHERDUCK_DATABASE: chicago_crimes_2020_to_2026
        run: |
          mkdir -p _site
          cp dashboard/static/* _site/
          python src/build_dashboard.py --output _site/data

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v5
